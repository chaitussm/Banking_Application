name: Dev Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # 10:00 PM IST = 4:30 PM UTC
    - cron: "30 16 * * *"
  workflow_dispatch:

run-name: "Dev Pipeline - ${{ github.event_name }} @ ${{ github.ref_name }}"

concurrency:
  group: dev-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"

defaults:
  run:
    shell: bash

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend server syntax
        working-directory: backend
        run: node --check src/server.js

      - name: Validate backend store syntax
        working-directory: backend
        run: node --check src/data/store.js

      - name: Package backend artifact
        run: |
          mkdir -p artifacts/backend
          cp -R backend/src artifacts/backend/src
          cp backend/package.json artifacts/backend/package.json
          cp backend/package-lock.json artifacts/backend/package-lock.json

      - name: Upload backend artifact
        uses: actions/upload-artifact@v5
        with:
          name: backend-build
          path: artifacts/backend
          if-no-files-found: error

      - name: Backend job summary
        if: always()
        run: |
          {
            echo "## Backend Checks"
            echo ""
            echo "- Result: \`${{ job.status }}\`"
            echo "- Artifact: \`backend-build\`"
            echo "- Validated: \`src/server.js\`, \`src/data/store.js\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error

      - name: Frontend job summary
        if: always()
        run: |
          {
            echo "## Frontend Checks"
            echo ""
            echo "- Result: \`${{ job.status }}\`"
            echo "- Artifact: \`frontend-build\`"
            echo "- Command: \`npm run build\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-report:
    name: Pipeline HTML Report
    needs: [backend-checks, frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS || secrets.GMAIL_APP_PASSWORD || secrets.MAIL_PASSWORD || secrets.EMAIL_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate HTML database report
        working-directory: backend
        env:
          BACKEND_JOB_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_JOB_RESULT: ${{ needs.frontend-checks.result }}
          REPORT_OUTPUT_DIR: ${{ github.workspace }}/artifacts/reports
        run: node scripts/generate-pipeline-report.mjs

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-html-report
          path: artifacts/reports/pipeline-report.html
          if-no-files-found: error

      - name: Publish report to job summary
        run: |
          {
            echo "## Pipeline HTML report"
            echo ""
            echo "A styled HTML report with SQLite schema, row counts, users (no passwords), accounts, and transactions is attached as artifact \`pipeline-html-report\`."
            echo ""
            echo "- Backend Checks: \`${{ needs.backend-checks.result }}\`"
            echo "- Frontend Checks: \`${{ needs.frontend-checks.result }}\`"
            echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send HTML report by email
        if: env.SMTP_TO != '' && env.SMTP_FROM != ''
        continue-on-error: true
        env:
          REPORT_HTML_PATH: artifacts/reports/pipeline-report.html
          REPORT_SUBJECT: "NovaBank Dev Pipeline report — ${{ github.event_name }} @ ${{ github.ref_name }} (#${{ github.run_number }})"
        run: python3 .github/scripts/send-pipeline-report.py
